monzo_finance:
  target: dev
  outputs:
    # Fast offline iteration against dbt/fixtures/raw - no Azure calls, no auth needed.
    dev:
      type: duckdb
      path: "dev.duckdb"
      threads: 4

    # Reads/writes the real raw/staging/marts containers in Blob Storage. Auth is DuckDB's azure
    # credential_chain provider (no stored secret) - resolves via `az login` locally, and via
    # azure/login@v2's underlying `az login` (OIDC federated token) in GitHub Actions.
    azure:
      type: duckdb
      path: "azure.duckdb"
      threads: 4
      extensions:
        - azure
      # DuckDB's default HTTP transport can't find the CA bundle on GitHub Actions' minimal Linux
      # runner ("Problem with the SSL CA cert") - curl transport fixes that there. But forcing
      # curl everywhere breaks it the other way on Windows (no default CA bundle for curl to find),
      # so this is env-driven: unset locally (default transport), DBT_AZURE_TRANSPORT=curl in CI.
      settings:
        azure_transport_option_type: "{{ env_var('DBT_AZURE_TRANSPORT', 'default') }}"
      secrets:
        - type: azure
          provider: credential_chain
          chain: "cli"
          account_name: "stmonzodedsghvv"
