version: 2

models:
  - name: stg_transactions
    description: >
      One row per transaction, deduped by transaction_id (reconciliation wins over webhook -
      see docs/decisions/0001-reconciliation-as-source-of-truth.md). Materialized as a plain
      table, rebuilt fresh every run - not dbt's `incremental` materialization, which requires a
      local relation to persist between runs and is therefore always a no-op on GitHub Actions'
      ephemeral runners. Instead unions a scoped, recent read of raw/ with the already-published
      staging/ output once there's a watermark to scope from - see
      dbt/macros/incremental_scoping.sql.
    columns:
      - name: transaction_id
        description: Monzo transaction ID.
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: amount_minor_units
        description: Signed amount in minor currency units (pence for GBP). Negative = spend.
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["GBP"]
      - name: created_at
        data_tests:
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              # warn, not error: Monzo's category list is an external, evolving vocabulary we
              # don't control (this list was already missing "savings" against real account
              # data) - a hard failure here would break the whole pipeline over something that
              # isn't actually a data quality problem, just a taxonomy we haven't seen yet.
              config:
                severity: warn
              arguments:
                values:
                  - general
                  - eating_out
                  - expenses
                  - groceries
                  - bills
                  - entertainment
                  - transport
                  - holidays
                  - family
                  - personal_care
                  - shopping
                  - cash
                  - transfers
                  - income
                  - gifts
                  - finances
                  - savings
      - name: ingestion_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["webhook", "reconciliation"]

  - name: export_staging_transactions
    description: >
      Publishes stg_transactions to the staging/ container as Parquet, Hive-partitioned by
      transaction_year/transaction_month. dbt-duckdb's `external` materialization can't also be
      `incremental`, so this always rewrites whatever its SELECT returns - but the SELECT itself
      is scoped to the same recent window as stg_transactions' own read (incremental_scan_from()),
      so in practice only the months that could plausibly have changed get rewritten. DuckDB's
      partitioned COPY leaves partitions outside the current result set untouched, not deleted.
