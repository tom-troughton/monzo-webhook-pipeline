name: monzo_finance
version: "1.0.0"
config-version: 2

profile: monzo_finance

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Glob dbt-duckdb reads raw transaction JSON from when NOT using the `azure` target (which
  # reads the real raw/ container instead - see the target.name check in models/staging/_sources.yml).
  raw_transactions_glob: "fixtures/raw/**/*.json"

models:
  monzo_finance:
    staging:
      +materialized: view
    marts:
      +materialized: table
