name: monzo_finance
version: "1.0.0"
config-version: 2

profile: monzo_finance

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Glob dbt-duckdb reads raw transaction JSON from. Defaults to the local
  # synthetic fixtures; CI/prod overrides this to an az:// path once the
  # dbt pipeline is wired up to real Blob Storage.
  raw_transactions_glob: "fixtures/raw/**/*.json"

models:
  monzo_finance:
    staging:
      +materialized: view
    marts:
      +materialized: table
