name: Reconcile

# Drives the reconciliation Function externally rather than relying on its native Timer trigger -
# Flex Consumption doesn't reliably wake a scaled-to-zero app for its own schedule (confirmed via
# App Insights: zero invocations ever, across two missed ticks; a known, documented Flex
# Consumption issue - see docs/decisions/0013). An HTTP call from here forces the wake-up instead.
#
# Same cadence as the old Timer trigger (0 0 */6 * * *: 00:00, 06:00, 12:00, 18:00 UTC). GitHub's
# scheduler isn't exact under load, so treat this as "about every 6 hours", not a precise clock.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconciliation
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://func-monzode-dev.azurewebsites.net/api/reconcile/${{ secrets.RECONCILE_TRIGGER_SECRET }}" \
            --max-time 300)
          if [ "$status" != "200" ]; then
            echo "Reconcile trigger failed with HTTP $status"
            exit 1
          fi
          echo "Reconcile triggered successfully (HTTP 200)"
