name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "terraform/**"
      - "functions/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [master]
    paths:
      - "terraform/**"
      - "functions/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  # Hard gate on the Function App's own test suite before any code is published. Reuses
  # tests.yml rather than repeating its steps, so this gate and the PR check are the same job
  # by construction. Runs in parallel with terraform - only deploy-functions waits on it, since
  # the infrastructure apply doesn't depend on Python tests passing.
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml

  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      function_app_name: ${{ steps.output.outputs.function_app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - run: terraform fmt -check -recursive

      - run: terraform init -input=false

      - name: Terraform plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var="monzo_client_id=ci-placeholder-ignored-after-first-apply" \
            -var="monzo_client_secret=ci-placeholder-ignored-after-first-apply" \
            -var="monzo_refresh_token=ci-placeholder-ignored-after-first-apply" \
            -var="github_dispatch_token=ci-placeholder-ignored-after-first-apply"

      - name: Terraform apply
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read function app name
        id: output
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

  deploy-functions:
    name: Deploy Function App code
    needs: [terraform, test]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      # func's own post-deploy health check is unreliable against Flex Consumption apps - it
      # reported "unhealthy" on two separate deploys here even though the app was confirmed
      # genuinely healthy both times (functions indexed, webhook returning its expected 400 for a
      # bad payload) seconds later. Don't fail the job on func's internal check; verify the real
      # behaviour directly instead.
      - name: Publish
        working-directory: functions
        run: func azure functionapp publish ${{ needs.terraform.outputs.function_app_name }} --python || true

      - name: Verify deployment
        run: |
          url="https://${{ needs.terraform.outputs.function_app_name }}.azurewebsites.net/api/webhook/healthcheck"
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -d '{}' --max-time 30)
            if [ "$status" = "400" ]; then
              echo "Webhook responded 400 as expected (validation rejected the health-check payload) - deployment verified healthy."
              exit 0
            fi
            echo "Attempt $i: got HTTP $status, retrying in 15s..."
            sleep 15
          done
          echo "Webhook did not respond as expected after 6 attempts - treating deployment as failed."
          exit 1
