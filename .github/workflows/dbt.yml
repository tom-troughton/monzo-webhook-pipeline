name: dbt

on:
  push:
    branches: [master]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"
  pull_request:
    branches: [master]
    paths:
      - "dbt/**"
  schedule:
    # Reliability fallback per the spec's CI/CD section, in case the Event Grid path (below) ever
    # misses an event. Incremental - scoped to recent raw/ data only, see
    # scoped_raw_transactions_source() in dbt/macros/.
    - cron: "0 5 * * *"
    # Weekly --full-refresh backstop (Sundays). The incremental scoping above trades a small,
    # bounded correctness risk (a backdated reconciliation write older than the margin could be
    # missed - see the macro's docstring) for not rescanning years of raw/ every night; this closes
    # that gap on a regular cadence regardless of margin size.
    - cron: "0 5 * * 0"
  workflow_dispatch: {}
  # Near-real-time path (docs/decisions/0011): dispatched by the on_raw_data_created Event Grid
  # handler in functions/function_app.py when new data lands in raw/. Additive to the cron
  # fallback above, not a replacement for it.
  repository_dispatch:
    types: [raw-data-updated]

permissions:
  contents: read

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: dbt build (local fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dbt/requirements.txt

      - run: pip install -r requirements.txt

      # DuckDB's COPY TO doesn't create missing directories - the external models need these
      # to exist before dbt build runs (see the equivalent local-dev note in CLAUDE.md).
      - run: mkdir -p export/staging export/marts

      # dev target only - local fixtures, no Azure calls, safe to run on every PR.
      - run: dbt build

  publish:
    name: dbt build (real Blob Storage)
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
      # See the comment on the azure target's `settings` in dbt/profiles.yml.
      DBT_AZURE_TRANSPORT: curl
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dbt/requirements.txt

      - run: pip install -r requirements.txt

      - name: Determine build args
        id: build_args
        run: |
          if [ "${{ github.event.schedule }}" = "0 5 * * 0" ]; then
            echo "args=--full-refresh" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # azure/login performs an actual `az login` with the federated OIDC token, so DuckDB's
      # azure extension credential_chain (chain: cli, in profiles.yml) picks it up the same way
      # it does locally via `az login` - no separate secret or connection string needed.
      - run: dbt build --target azure ${{ steps.build_args.outputs.args }}
